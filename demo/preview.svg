<svg xmlns="http://www.w3.org/2000/svg" width="1200"
height="802" viewBox="0 0 1200 802" role="img"
aria-labelledby="title description">
<title id="title">ValutaTrade Hub — запись сеанса</title>
<desc id="description">Фрагмент реальной записи: покупка, портфель,
продажа и ошибка нехватки средств.</desc>
<rect width="1200" height="802" rx="16" fill="#111827"/>
<path d="M16 0H1184Q1200 0 1200 16V56H0V16Q0 0 16 0" fill="#202c3c"/>
<circle cx="28" cy="28" r="6" fill="#f07178"/>
<circle cx="48" cy="28" r="6" fill="#f6d28b"/>
<circle cx="68" cy="28" r="6" fill="#79dfc6"/>
<text x="98" y="34" font-family="sans-serif" font-size="17" fill="#eef4ff">
ValutaTrade Hub · Kiselev · М26-555</text>
<g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14"
xml:space="preserve">
<text x="28" y="94" fill="#79dfc6">&gt; buy --currency BTC --amount 0.05</text>
<text x="28" y="116" fill="#dce4ef">Покупка выполнена: 0.0500 BTC по курсу 81518.00 USD/BTC</text>
<text x="28" y="138" fill="#dce4ef">Изменения в портфеле:</text>
<text x="28" y="160" fill="#dce4ef">- BTC: было 0.0000 → стало 0.0500</text>
<text x="28" y="182" fill="#f6d28b">Оценочная стоимость покупки: 4,075.90 USD</text>
<text x="28" y="204" fill="#79dfc6">&gt; buy --currency EUR --amount 200</text>
<text x="28" y="226" fill="#dce4ef">Покупка выполнена: 200.00 EUR по курсу 1.1217 USD/EUR</text>
<text x="28" y="248" fill="#dce4ef">Изменения в портфеле:</text>
<text x="28" y="270" fill="#dce4ef">- EUR: было 0.00 → стало 200.00</text>
<text x="28" y="292" fill="#f6d28b">Оценочная стоимость покупки: 224.35 USD</text>
<text x="28" y="314" fill="#79dfc6">&gt; buy --currency USD --amount 150</text>
<text x="28" y="336" fill="#dce4ef">Покупка выполнена: 150.00 USD по курсу 1.0000 USD/USD</text>
<text x="28" y="358" fill="#dce4ef">Изменения в портфеле:</text>
<text x="28" y="380" fill="#dce4ef">- USD: было 0.00 → стало 150.00</text>
<text x="28" y="402" fill="#f6d28b">Оценочная стоимость покупки: 150.00 USD</text>
<text x="28" y="424" fill="#79dfc6">&gt; show-portfolio</text>
<text x="28" y="446" fill="#dce4ef">Портфель пользователя &#x27;alice&#x27; (база: USD):</text>
<text x="28" y="468" fill="#dce4ef">- BTC: 0.0500  → 4075.90 USD</text>
<text x="28" y="490" fill="#dce4ef">- EUR: 200.00  → 224.35 USD</text>
<text x="28" y="512" fill="#dce4ef">- USD: 150.00  → 150.00 USD</text>
<text x="28" y="534" fill="#dce4ef">---------------------------------</text>
<text x="28" y="556" fill="#f6d28b">ИТОГО: 4,450.25 USD</text>
<text x="28" y="578" fill="#79dfc6">&gt; sell --currency BTC --amount 0.01</text>
<text x="28" y="600" fill="#dce4ef">Продажа выполнена: 0.0100 BTC по курсу 81518.00 USD/BTC</text>
<text x="28" y="622" fill="#dce4ef">Изменения в портфеле:</text>
<text x="28" y="644" fill="#dce4ef">- BTC: было 0.0500 → стало 0.0400</text>
<text x="28" y="666" fill="#f6d28b">Оценочная выручка: 815.18 USD</text>
<text x="28" y="688" fill="#79dfc6">&gt; sell --currency BTC --amount 1</text>
<text x="28" y="710" fill="#ffaba8">Недостаточно средств: доступно 0.0400 BTC, требуется 1.0000 BTC</text>
</g>
<path d="M29 756l18 10-18 10z" fill="#79dfc6"/>
<text x="60" y="772" font-family="sans-serif" font-size="16" fill="#c8d4e5">
Полная запись: demo/index.html · регистрация, сделки, курсы и ошибки</text>
</svg>
